# ==============================================================================
# Easy-HAOS GRUB2 Configuration (UEFI & Legacy BIOS Hybrid)
# ==============================================================================
# Christian Bennetsen | https://bennetsen.dk | christian@bennetsen.dk
# "If you're reading this during boot, press Enter and pray."
# ==============================================================================

set timeout=5
set default=0

# Load video / terminal modules gracefully across UEFI & BIOS
insmod all_video
insmod gfxterm
insmod font

if loadfont unicode; then
    set gfxmode=auto
    terminal_output gfxterm
fi

set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan

menuentry "Easy-HAOS Auto-Installer (Recommended - Auto-Start on tty1)" {
    linux /boot/vmlinuz quiet loglevel=3 console=tty1
    initrd /boot/initrd.img
}

menuentry "Easy-HAOS Auto-Installer (Verbose Debug Mode)" {
    linux /boot/vmlinuz loglevel=7 console=tty1
    initrd /boot/initrd.img
}

menuentry "Easy-HAOS Auto-Installer (Safe Graphics / nomodeset)" {
    linux /boot/vmlinuz nomodeset quiet loglevel=3 console=tty1
    initrd /boot/initrd.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI Firmware Settings (Enter BIOS to disable Secure Boot)" {
        fwsetup
    }
fi

menuentry "Reboot Machine" {
    reboot
}

menuentry "Power Off" {
    halt
}
