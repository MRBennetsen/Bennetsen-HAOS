# ==============================================================================
# Easy-HAOS GRUB2 Configuration (Standalone UEFI)
# ==============================================================================
# Christian Bennetsen | https://bennetsen.dk | christian@bennetsen.dk
# "If you're reading this during boot, press Enter and pray."
# ==============================================================================

set timeout=5
set default=0

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod exfat
insmod ext2
insmod search_fs_file

# Locate the Easy-HAOS ISO / USB partition across ISO9660, Ventoy, and Rufus FAT32
search --no-floppy --file --set=root /.easy-haos-usb

# Keep native UEFI text console to avoid Haswell/M93p GOP framebuffer lockups
terminal_output console

set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan

menuentry "Easy-HAOS Auto-Installer (Recommended - Auto-Start on tty1)" {
    linux /boot/vmlinuz nomodeset console=tty0 console=tty1 loglevel=4 panic=30
    initrd /boot/initrd.img
}

menuentry "Easy-HAOS Auto-Installer (Verbose Debug Mode)" {
    linux /boot/vmlinuz nomodeset console=tty0 console=tty1 loglevel=7 ignore_loglevel panic=30
    initrd /boot/initrd.img
}

menuentry "Easy-HAOS Auto-Installer (Native GPU / No nomodeset)" {
    linux /boot/vmlinuz console=tty0 console=tty1 loglevel=4 panic=30
    initrd /boot/initrd.img
}

menuentry "UEFI Firmware Settings (Enter BIOS to disable Secure Boot)" {
    fwsetup
}

menuentry "Reboot Machine" {
    reboot
}

menuentry "Power Off" {
    halt
}
